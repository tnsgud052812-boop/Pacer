<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 캔탑스 만보걷기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
        }

        /* 메인 레이아웃 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }

        .btn-danger {
            border-color: rgba(248, 113, 113, 0.5);
            color: #f87171;
        }

        /* 탭 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
        }

        /* 카드 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* 그룹/팀 리스트 */
        .group-item, .team-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .group-item:hover, .team-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .item-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .item-btn-edit {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .item-btn-delete {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .teams-container {
            margin-left: 20px;
            padding-left: 15px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }

        .members-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .member-tag {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        .form-select option {
            background: #1a1a2e;
        }

        /* 멤버 선택 */
        .member-select-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
        }

        .member-checkbox {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .member-checkbox:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .member-checkbox input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        /* 토스트 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
        }

        .toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #10b981;
        }

        .toast.error {
            background: #f87171;
        }

        /* 저장 버튼 고정 */
        .save-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .save-bar .btn {
            min-width: 150px;
        }

        .content-wrapper {
            padding-bottom: 80px;
        }

        /* 검색 */
        .search-box {
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .status-banner {
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #aaa;
            line-height: 1.5;
        }

        .status-banner.success {
            border-color: rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .status-banner.error {
            border-color: rgba(248, 113, 113, 0.45);
            color: #fca5a5;
        }

        .editor-disabled {
            opacity: 0.45;
            pointer-events: none;
            user-select: none;
        }

        .token-help {
            color: #999;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- 메인 콘텐츠 -->
    <div class="container content-wrapper" id="mainContent">
        <div class="header">
            <h1>⚙️ 관리자 페이지</h1>
            <div class="header-btns">
                <button class="btn" onclick="location.href='index.html'">📊 메인으로</button>
            </div>
        </div>

        <div class="status-banner" id="configStatus">설정 파일을 불러오는 중입니다…</div>

        <!-- 그룹/팀 관리 -->
        <div class="tab-content editor-disabled" id="groupsTab">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📋 그룹 목록</span>
                    <button class="btn btn-primary" onclick="showAddGroupModal()">+ 그룹 추가</button>
                </div>
                <div id="groupsList"></div>
            </div>
        </div>
    </div>

    <!-- 저장 바 -->
    <div class="save-bar" id="saveBar" style="display:none;">
        <button class="btn" onclick="discardChanges()">변경 취소</button>
        <button class="btn btn-primary" onclick="saveConfig()">💾 GitHub에 저장</button>
    </div>

    <!-- 그룹 추가/수정 모달 -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="groupModalTitle">그룹 추가</span>
                <button class="modal-close" onclick="closeModal('groupModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">그룹 이름</label>
                    <input type="text" class="form-input" id="groupName" placeholder="예: 그룹 A">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('groupModal')">취소</button>
                <button class="btn btn-primary" onclick="saveGroup()">저장</button>
            </div>
        </div>
    </div>

    <!-- 팀 추가/수정 모달 -->
    <div class="modal-overlay" id="teamModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="teamModalTitle">팀 추가</span>
                <button class="modal-close" onclick="closeModal('teamModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">팀 이름</label>
                    <input type="text" class="form-input" id="teamName" placeholder="예: 기술표준팀">
                </div>
                <div class="form-group">
                    <label class="form-label">팀원 선택</label>
                    <div class="search-box">
                        <input type="text" class="search-input" id="memberSearch" placeholder="이름 검색..." oninput="filterMembers()">
                    </div>
                    <div class="member-select-list" id="memberSelectList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('teamModal')">취소</button>
                <button class="btn btn-primary" onclick="saveTeam()">저장</button>
            </div>
        </div>
    </div>

    <!-- GitHub 저장 인증 모달 -->
    <div class="modal-overlay" id="tokenModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">🔐 GitHub 저장 인증</span>
                <button class="modal-close" onclick="closeTokenModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">GitHub Personal Access Token</label>
                    <input type="password" class="form-input" id="githubToken"
                        placeholder="github_pat_… 또는 ghp_…" autocomplete="off"
                        onkeydown="if(event.key==='Enter')confirmSaveConfig()">
                    <p class="token-help">
                        저장할 때만 사용되며 브라우저에 보관하지 않습니다.<br>
                        이 저장소의 Contents 읽기/쓰기 권한이 필요합니다.
                    </p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeTokenModal()">취소</button>
                <button class="btn btn-primary" id="confirmSaveBtn" onclick="confirmSaveConfig()">저장</button>
            </div>
        </div>
    </div>

    <!-- 토스트 -->
    <div class="toast" id="toast"></div>

    <script>
        // GitHub 설정
        const REPO_OWNER = 'tnsgud052812-boop';
        const REPO_NAME = 'Pacer';
        const BRANCH = 'main';
        const CONFIG_PATH = 'data/config.json';

        // 상태
        let config = { groups: [] };
        let allMembers = [];
        let fetchedMembers = [];
        let editingGroupId = null;
        let editingTeamId = null;
        let editingGroupIdForTeam = null;
        let hasChanges = false;
        let configLoaded = false;
        let loadedConfigSnapshot = '';
        let saveInProgress = false;

        // 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([loadAllMembers(), loadConfig()]);
            syncAllMembers();
        });

        window.addEventListener('beforeunload', event => {
            if (!hasChanges) return;
            event.preventDefault();
            event.returnValue = '';
        });

        // 전체 멤버 로드 (latest.csv에서)
        async function loadAllMembers() {
            try {
                const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/latest.csv?t=${Date.now()}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csv = await response.text();
                fetchedMembers = parseCSV(csv)
                    .map(row => getField(row, ['이름', '성명', '닉네임', 'name', 'Name']))
                    .filter(Boolean);
                syncAllMembers();
                console.log('멤버 로드:', fetchedMembers.length);
            } catch (e) {
                fetchedMembers = [];
                syncAllMembers();
                console.error('멤버 로드 실패:', e);
                showToast('최신 멤버 목록을 불러오지 못했습니다. 기존 설정의 팀원만 표시합니다.', 'error');
            }
        }

        // 설정 로드
        async function loadConfig() {
            setConfigStatus('설정 파일을 불러오는 중입니다…');
            setEditorEnabled(false);

            try {
                const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${CONFIG_PATH}?t=${Date.now()}`;
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const loaded = await response.json();
                config = normalizeConfig(loaded);
                loadedConfigSnapshot = stableStringify(config);
                configLoaded = true;
                hasChanges = false;
                document.getElementById('saveBar').style.display = 'none';
                syncAllMembers();
                renderGroups();
                setEditorEnabled(true);
                setConfigStatus('설정을 정상적으로 불러왔습니다. 저장할 때 GitHub 토큰으로 인증합니다.', 'success');
            } catch (e) {
                console.error('설정 로드 실패:', e);
                configLoaded = false;
                hasChanges = false;
                document.getElementById('saveBar').style.display = 'none';
                setEditorEnabled(false);
                setConfigStatus(
                    `설정 파일을 불러오지 못했습니다 (${e.message}). 데이터 보호를 위해 편집과 저장을 차단했습니다.`,
                    'error'
                );
            }
        }

        function setConfigStatus(message, type = '') {
            const status = document.getElementById('configStatus');
            status.textContent = message;
            status.className = `status-banner ${type}`.trim();
        }

        function setEditorEnabled(enabled) {
            document.getElementById('groupsTab').classList.toggle('editor-disabled', !enabled);
        }

        function normalizeConfig(data) {
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
                throw new Error('config.json 형식이 올바르지 않습니다');
            }

            const normalized = { ...data };
            normalized.groups = Array.isArray(data.groups) ? data.groups.map((group, groupIndex) => ({
                ...group,
                id: String(group?.id ?? `group-${groupIndex + 1}`),
                name: String(group?.name ?? `그룹 ${groupIndex + 1}`).trim(),
                teams: Array.isArray(group?.teams) ? group.teams.map((team, teamIndex) => ({
                    ...team,
                    id: String(team?.id ?? `team-${groupIndex + 1}-${teamIndex + 1}`),
                    name: String(team?.name ?? `팀 ${teamIndex + 1}`).trim(),
                    members: Array.isArray(team?.members)
                        ? [...new Set(team.members.map(normalizeMemberName).filter(Boolean))]
                        : []
                })) : []
            })) : [];

            return normalized;
        }

        function normalizeMemberName(member) {
            if (typeof member === 'string') return member.trim();
            if (!member || typeof member !== 'object') return '';
            return String(member.name ?? member['이름'] ?? member.displayName ?? '').trim();
        }

        function syncAllMembers() {
            const members = new Set(fetchedMembers.map(name => String(name).trim()).filter(Boolean));
            (config.groups || []).forEach(group => {
                (group.teams || []).forEach(team => {
                    (team.members || []).forEach(member => members.add(member));
                });
            });
            allMembers = [...members].sort((a, b) => a.localeCompare(b, 'ko'));
        }

        function parseCSV(csv) {
            if (typeof csv !== 'string' || !csv.trim()) return [];

            const text = csv.replace(/^\uFEFF/, '');
            const records = [];
            let record = [];
            let field = '';
            let quoted = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (quoted && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        quoted = !quoted;
                    }
                } else if (char === ',' && !quoted) {
                    record.push(field);
                    field = '';
                } else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && text[i + 1] === '\n') i++;
                    record.push(field);
                    if (record.some(value => String(value).trim() !== '')) records.push(record);
                    record = [];
                    field = '';
                } else {
                    field += char;
                }
            }

            record.push(field);
            if (record.some(value => String(value).trim() !== '')) records.push(record);
            if (records.length < 2) return [];

            const headers = records.shift().map(header => String(header).replace(/^\uFEFF/, '').trim());
            return records.map(values => {
                const row = {};
                headers.forEach((header, index) => {
                    if (header) row[header] = String(values[index] ?? '').trim();
                });
                return row;
            });
        }

        function getField(row, aliases) {
            for (const key of aliases) {
                const value = row?.[key];
                if (value !== undefined && value !== null && String(value).trim() !== '') {
                    return String(value).trim();
                }
            }
            return '';
        }

        // 그룹 렌더링
        function renderGroups() {
            const container = document.getElementById('groupsList');
            
            if (config.groups.length === 0) {
                container.innerHTML = '<div class="empty-state">그룹이 없습니다. 그룹을 추가해주세요.</div>';
                return;
            }
            
            container.innerHTML = config.groups.map(group => `
                <div class="group-item">
                    <div class="item-header">
                        <span class="item-name">🏆 ${escapeHTML(group.name)}</span>
                        <div class="item-actions">
                            <button class="item-btn item-btn-edit" onclick="showAddTeamModal(${actionArg(group.id)})">+ 팀 추가</button>
                            <button class="item-btn item-btn-edit" onclick="showEditGroupModal(${actionArg(group.id)})">수정</button>
                            <button class="item-btn item-btn-delete" onclick="deleteGroup(${actionArg(group.id)})">삭제</button>
                        </div>
                    </div>
                    <div class="teams-container">
                        ${(group.teams || []).map(team => `
                            <div class="team-item">
                                <div class="item-header">
                                    <span class="item-name">👥 ${escapeHTML(team.name)}</span>
                                    <div class="item-actions">
                                        <button class="item-btn item-btn-edit" onclick="showEditTeamModal(${actionArg(group.id)}, ${actionArg(team.id)})">수정</button>
                                        <button class="item-btn item-btn-delete" onclick="deleteTeam(${actionArg(group.id)}, ${actionArg(team.id)})">삭제</button>
                                    </div>
                                </div>
                                <div class="members-list">
                                    ${(team.members || []).map(m => `<span class="member-tag">${escapeHTML(m)}</span>`).join('')}
                                    ${team.members?.length === 0 ? '<span style="color:#666">팀원 없음</span>' : ''}
                                </div>
                            </div>
                        `).join('')}
                        ${(group.teams || []).length === 0 ? '<div class="empty-state" style="padding:20px">팀이 없습니다.</div>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // 모달 닫기
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 그룹 추가 모달
        function showAddGroupModal() {
            editingGroupId = null;
            document.getElementById('groupModalTitle').textContent = '그룹 추가';
            document.getElementById('groupName').value = '';
            document.getElementById('groupModal').classList.add('active');
        }

        // 그룹 수정 모달
        function showEditGroupModal(groupId) {
            const group = config.groups.find(g => g.id === groupId);
            if (!group) return;
            
            editingGroupId = groupId;
            document.getElementById('groupModalTitle').textContent = '그룹 수정';
            document.getElementById('groupName').value = group.name;
            document.getElementById('groupModal').classList.add('active');
        }

        // 그룹 저장
        function saveGroup() {
            const name = document.getElementById('groupName').value.trim();
            if (!name) {
                showToast('그룹 이름을 입력하세요', 'error');
                return;
            }
            
            if (editingGroupId) {
                const group = config.groups.find(g => g.id === editingGroupId);
                if (group) group.name = name;
            } else {
                config.groups.push({
                    id: 'group' + Date.now(),
                    name: name,
                    teams: []
                });
            }
            
            markChanged();
            renderGroups();
            closeModal('groupModal');
            showToast('그룹이 저장되었습니다', 'success');
        }

        // 그룹 삭제
        function deleteGroup(groupId) {
            if (!confirm('이 그룹을 삭제하시겠습니까? 포함된 팀도 모두 삭제됩니다.')) return;
            
            config.groups = config.groups.filter(g => g.id !== groupId);
            markChanged();
            renderGroups();
            showToast('그룹이 삭제되었습니다', 'success');
        }

        // 팀 추가 모달
        function showAddTeamModal(groupId) {
            editingTeamId = null;
            editingGroupIdForTeam = groupId;
            document.getElementById('teamModalTitle').textContent = '팀 추가';
            document.getElementById('teamName').value = '';
            document.getElementById('memberSearch').value = '';
            renderMemberCheckboxes([]);
            document.getElementById('teamModal').classList.add('active');
        }

        // 팀 수정 모달
        function showEditTeamModal(groupId, teamId) {
            const group = config.groups.find(g => g.id === groupId);
            const team = group?.teams?.find(t => t.id === teamId);
            if (!team) return;
            
            editingTeamId = teamId;
            editingGroupIdForTeam = groupId;
            document.getElementById('teamModalTitle').textContent = '팀 수정';
            document.getElementById('teamName').value = team.name;
            document.getElementById('memberSearch').value = '';
            renderMemberCheckboxes(team.members || []);
            document.getElementById('teamModal').classList.add('active');
        }

        // 선택된 멤버 상태 저장용
        let currentSelectedMembers = new Set();

        // 멤버 체크박스 렌더링
        function renderMemberCheckboxes(selectedMembers, keepSelection = false) {
            const container = document.getElementById('memberSelectList');
            const search = document.getElementById('memberSearch').value.toLowerCase();
            
            // 초기 로드시에만 selectedMembers로 초기화
            if (!keepSelection) {
                currentSelectedMembers = new Set(selectedMembers);
            }
            
            // 이미 다른 팀에 배정된 멤버 찾기
            const assignedMembers = new Set();
            config.groups.forEach(g => {
                g.teams?.forEach(t => {
                    if (!(editingGroupIdForTeam === g.id && editingTeamId === t.id)) {
                        t.members?.forEach(m => assignedMembers.add(m));
                    }
                });
            });
            
            const filtered = allMembers.filter(m => m.toLowerCase().includes(search));
            
            container.innerHTML = filtered.map(member => {
                const isAssigned = assignedMembers.has(member);
                const isChecked = currentSelectedMembers.has(member);
                
                return `
                    <label class="member-checkbox" style="${isAssigned && !isChecked ? 'opacity:0.4' : ''}">
                        <input type="checkbox" value="${escapeHTML(member)}" 
                            ${isChecked ? 'checked' : ''} 
                            ${isAssigned && !isChecked ? 'disabled' : ''}
                            onchange="toggleMemberSelection(${actionArg(member)}, this.checked)">
                        <span>${escapeHTML(member)}</span>
                        ${isAssigned && !isChecked ? '<span style="color:#f87171;font-size:0.75rem;margin-left:auto">다른팀</span>' : ''}
                    </label>
                `;
            }).join('');
        }

        // 멤버 선택 토글
        function toggleMemberSelection(member, checked) {
            if (checked) {
                currentSelectedMembers.add(member);
            } else {
                currentSelectedMembers.delete(member);
            }
        }

        // 멤버 필터
        function filterMembers() {
            renderMemberCheckboxes([], true);
        }

        // 팀 저장
        function saveTeam() {
            const name = document.getElementById('teamName').value.trim();
            if (!name) {
                showToast('팀 이름을 입력하세요', 'error');
                return;
            }
            
            const selectedMembers = [...currentSelectedMembers];
            
            const group = config.groups.find(g => g.id === editingGroupIdForTeam);
            if (!group) return;
            
            if (!group.teams) group.teams = [];
            
            if (editingTeamId) {
                const team = group.teams.find(t => t.id === editingTeamId);
                if (team) {
                    team.name = name;
                    team.members = selectedMembers;
                }
            } else {
                group.teams.push({
                    id: 'team' + Date.now(),
                    name: name,
                    members: selectedMembers
                });
            }
            
            markChanged();
            renderGroups();
            closeModal('teamModal');
            showToast('팀이 저장되었습니다', 'success');
        }

        // 팀 삭제
        function deleteTeam(groupId, teamId) {
            if (!confirm('이 팀을 삭제하시겠습니까?')) return;
            
            const group = config.groups.find(g => g.id === groupId);
            if (group) {
                group.teams = group.teams.filter(t => t.id !== teamId);
            }
            
            markChanged();
            renderGroups();
            showToast('팀이 삭제되었습니다', 'success');
        }

        // 변경 표시
        function markChanged() {
            if (!configLoaded) return;
            hasChanges = true;
            document.getElementById('saveBar').style.display = 'flex';
            setConfigStatus('저장되지 않은 변경 내용이 있습니다. 검토 후 GitHub에 저장하세요.');
        }

        async function discardChanges() {
            if (!hasChanges) return;
            if (!confirm('저장하지 않은 변경 내용을 취소하고 GitHub의 설정을 다시 불러오시겠습니까?')) return;
            await loadConfig();
            showToast('변경 내용을 취소했습니다.', 'success');
        }

        // GitHub 저장 인증 모달 표시
        function saveConfig() {
            if (!configLoaded) {
                showToast('설정을 정상적으로 불러온 후 저장할 수 있습니다.', 'error');
                return;
            }
            if (!hasChanges) {
                showToast('저장할 변경 내용이 없습니다.');
                return;
            }

            const input = document.getElementById('githubToken');
            input.value = '';
            document.getElementById('tokenModal').classList.add('active');
            setTimeout(() => input.focus(), 0);
        }

        function closeTokenModal() {
            if (saveInProgress) return;
            document.getElementById('githubToken').value = '';
            document.getElementById('tokenModal').classList.remove('active');
        }

        // GitHub의 현재 설정과 처음 읽은 설정이 같은 경우에만 저장한다.
        async function confirmSaveConfig() {
            if (saveInProgress || !configLoaded || !hasChanges) return;

            const tokenInput = document.getElementById('githubToken');
            const token = tokenInput.value.trim();
            if (!token) {
                showToast('GitHub 토큰을 입력하세요.', 'error');
                tokenInput.focus();
                return;
            }

            const saveButton = document.getElementById('confirmSaveBtn');
            saveInProgress = true;
            saveButton.disabled = true;
            saveButton.textContent = '저장 중…';

            try {
                const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CONFIG_PATH}`;
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };

                const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(BRANCH)}`, {
                    headers,
                    cache: 'no-store'
                });
                if (!getRes.ok) throw await githubResponseError(getRes, '현재 설정 확인 실패');

                const currentFile = await getRes.json();
                if (!currentFile.sha || !currentFile.content) {
                    throw new Error('GitHub에서 config.json의 SHA 또는 내용을 받지 못했습니다.');
                }

                const remoteConfig = normalizeConfig(JSON.parse(decodeBase64Utf8(currentFile.content)));
                if (stableStringify(remoteConfig) !== loadedConfigSnapshot) {
                    throw new Error('다른 사용자가 설정을 먼저 변경했습니다. 변경 취소 후 최신 설정을 다시 불러와 주세요.');
                }

                const configToSave = JSON.parse(JSON.stringify(config));
                configToSave.lastUpdated = new Date().toISOString();
                const content = encodeBase64Utf8(JSON.stringify(configToSave, null, 2));

                const body = {
                    message: '⚙️ 설정 업데이트',
                    content: content,
                    branch: BRANCH,
                    sha: currentFile.sha
                };

                const res = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        ...headers,
                        'Content-Type': 'application/json; charset=utf-8'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    config = configToSave;
                    loadedConfigSnapshot = stableStringify(config);
                    hasChanges = false;
                    document.getElementById('saveBar').style.display = 'none';
                    closeTokenModalAfterSave();
                    setConfigStatus('설정을 GitHub에 저장했습니다.', 'success');
                    showToast('GitHub에 저장되었습니다!', 'success');
                } else {
                    throw await githubResponseError(res, '저장 실패');
                }
            } catch (e) {
                console.error(e);
                setConfigStatus('저장하지 못했습니다: ' + e.message, 'error');
                showToast('저장 실패: ' + e.message, 'error');
            } finally {
                tokenInput.value = '';
                saveInProgress = false;
                saveButton.disabled = false;
                saveButton.textContent = '저장';
            }
        }

        function closeTokenModalAfterSave() {
            document.getElementById('githubToken').value = '';
            document.getElementById('tokenModal').classList.remove('active');
        }

        async function githubResponseError(response, prefix) {
            let detail = '';
            try {
                const data = await response.json();
                detail = data?.message ? `: ${data.message}` : '';
            } catch (e) {}
            return new Error(`${prefix} (HTTP ${response.status})${detail}`);
        }

        function encodeBase64Utf8(text) {
            const bytes = new TextEncoder().encode(text);
            let binary = '';
            bytes.forEach(byte => binary += String.fromCharCode(byte));
            return btoa(binary);
        }

        function decodeBase64Utf8(base64) {
            const binary = atob(String(base64).replace(/\s/g, ''));
            const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function stableStringify(value) {
            const sortValue = item => {
                if (Array.isArray(item)) return item.map(sortValue);
                if (item && typeof item === 'object') {
                    return Object.keys(item).sort().reduce((result, key) => {
                        result[key] = sortValue(item[key]);
                        return result;
                    }, {});
                }
                return item;
            };
            return JSON.stringify(sortValue(value));
        }

        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function actionArg(value) {
            return escapeHTML(JSON.stringify(String(value ?? '')));
        }

        // 토스트
        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast active ' + type;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }
    </script>
</body>
</html>
