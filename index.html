<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캔탑스 만보걷기</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0f14;
            --surface: #161a22;
            --surface2: #1e2330;
            --border: #2a2f3d;
            --text: #e8eaf0;
            --text-dim: #7a8195;
            --text-muted: #4a5068;
            --accent: #5b8def;
            --accent-glow: rgba(91, 141, 239, 0.15);
            --gold: #f0c850;
            --gold-dim: rgba(240, 200, 80, 0.12);
            --silver: #a0aec0;
            --bronze: #d4845e;
            --green: #4ade80;
            --red: #f87171;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            padding: 28px 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 960px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-meta {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .admin-link {
            display: inline-block;
            margin-top: 6px;
            padding: 5px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .admin-link:hover {
            background: var(--surface);
            color: var(--text);
            border-color: var(--accent);
        }

        /* ── Container ── */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ── Month Selector ── */
        .month-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding: 0 12px;
        }

        .month-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .month-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .month-label {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            min-width: 140px;
            text-align: center;
        }

        .month-days {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-left: 4px;
            font-weight: 400;
        }

        /* ── Notice ── */
        .notice {
            background: rgba(240, 200, 80, 0.06);
            border: 1px solid rgba(240, 200, 80, 0.15);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 0.8rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Summary Row ── */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .summary-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: center;
        }

        .summary-item .val {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .summary-item .lbl {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .val-accent { color: var(--accent); }
        .val-gold { color: var(--gold); }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 2px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        /* ── Team Card ── */
        .team-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .team-card:hover {
            border-color: var(--text-muted);
        }

        .tc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            gap: 16px;
            user-select: none;
        }

        .tc-rank {
            font-size: 1.5rem;
            font-weight: 900;
            min-width: 36px;
            text-align: center;
        }

        .tc-rank.r1 { color: var(--gold); }
        .tc-rank.r2 { color: var(--silver); }
        .tc-rank.r3 { color: var(--bronze); }
        .tc-rank.rd { color: var(--text-muted); }

        .tc-info { flex: 1; }

        .tc-name {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.3px;
        }

        .tc-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .tc-avg {
            text-align: right;
        }

        .tc-avg-num {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .tc-avg-unit {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .tc-chevron {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: transform 0.25s;
        }

        .team-card.open .tc-chevron {
            transform: rotate(180deg);
        }

        .tc-body {
            display: none;
            border-top: 1px solid var(--border);
            padding: 12px 20px 16px;
        }

        .team-card.open .tc-body {
            display: block;
        }

        /* ── Member Row (inside team) ── */
        .mr {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 6px;
        }

        .mr:last-child { border-bottom: none; }
        .mr:hover { background: var(--surface2); }

        .mr-idx {
            width: 24px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .mr-name {
            flex: 1;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .mr-avg {
            font-weight: 700;
            font-size: 0.92rem;
            min-width: 70px;
            text-align: right;
        }

        .mr-total {
            font-size: 0.72rem;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        /* ── Individual Ranking ── */
        .rank-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rank-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .rank-table th:last-child,
        .rank-table td:last-child {
            text-align: right;
        }

        .rank-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        .rank-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .rank-table tbody tr:hover {
            background: var(--surface2);
        }

        .rank-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.82rem;
        }

        .rn1 { background: var(--gold-dim); color: var(--gold); }
        .rn2 { background: rgba(160,174,192,0.1); color: var(--silver); }
        .rn3 { background: rgba(212,132,94,0.1); color: var(--bronze); }
        .rnd { color: var(--text-muted); }

        .bar-cell { width: 140px; }

        .mini-bar {
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .mini-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.88rem;
            margin-bottom: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        /* ── Modal ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.show { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 2;
        }

        .modal-hd h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .modal-bd {
            padding: 24px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface2);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .stat-card .sv {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-card .sl {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .stat-card .ss {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Calendar ── */
        .cal-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .cal-hd {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 6px 0;
            font-weight: 600;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.75rem;
            background: var(--surface2);
        }

        .cal-day.empty { background: transparent; }

        .cal-day.has {
            background: var(--accent-glow);
        }

        .cal-day.today {
            border: 1.5px solid var(--accent);
        }

        .cal-day .dn {
            font-weight: 600;
            color: var(--text-dim);
            font-size: 0.72rem;
        }

        .cal-day .ds {
            font-size: 0.55rem;
            color: var(--text-dim);
        }

        /* ── Loading ── */
        .loading-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .spin {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: sp 0.7s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes sp { to { transform: rotate(360deg); } }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .header { padding: 20px 16px 16px; }
            .container { padding: 0 12px 40px; }
            .summary-bar { grid-template-columns: 1fr; gap: 8px; }
            .summary-item { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
            .summary-item .val { font-size: 1.3rem; }
            .summary-item .lbl { margin-top: 0; }
            .bar-cell { display: none; }
            .month-label { font-size: 1.1rem; min-width: 120px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <div class="logo-icon">🚶</div>
        캔탑스 만보걷기
    </div>
    <div class="header-meta">
        <div id="updateTime">로딩 중...</div>
        <a href="admin.html" class="admin-link">⚙ 관리자</a>
    </div>
</div>

<div class="container">
    <!-- Notice -->
    <div class="notice">
        ⚠️ Pacer 앱 동기화가 늦어지면 통계가 달라질 수 있습니다. 매일 앱을 실행해 주세요.
    </div>

    <!-- Month Nav -->
    <div class="month-nav">
        <button class="month-btn" id="prevMonth" onclick="changeMonth(-1)">◀</button>
        <div class="month-label" id="monthLabel">–</div>
        <button class="month-btn" id="nextMonth" onclick="changeMonth(1)">▶</button>
    </div>

    <!-- Summary -->
    <div class="summary-bar">
        <div class="summary-item">
            <span class="lbl">참여 인원</span>
            <span class="val" id="sMembers">–</span>
        </div>
        <div class="summary-item">
            <span class="lbl">전체 하루 평균</span>
            <span class="val val-accent" id="sAvg">–</span>
        </div>
        <div class="summary-item">
            <span class="lbl">1위 팀</span>
            <span class="val val-gold" id="sTop">–</span>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="teams" onclick="switchTab('teams')">팀 순위</button>
        <button class="tab-btn" data-tab="all" onclick="switchTab('all')">전체 랭킹</button>
    </div>

    <!-- Teams Tab -->
    <div id="teamsPanel">
        <div id="teamList">
            <div class="loading-box"><div class="spin"></div>불러오는 중...</div>
        </div>
    </div>

    <!-- All Ranking Tab -->
    <div id="allPanel" style="display:none;">
        <input type="text" class="search-box" id="searchInput" placeholder="이름 검색..." oninput="filterRanking()">
        <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);">
            <table class="rank-table">
                <thead>
                    <tr>
                        <th style="width:50px;">#</th>
                        <th>이름</th>
                        <th>소속</th>
                        <th class="bar-cell"></th>
                        <th>하루 평균</th>
                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-hd">
            <h2 id="modalName">–</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-bd" id="modalBd">
            <div class="loading-box"><div class="spin"></div></div>
        </div>
    </div>
</div>

<script>
const REPO_OWNER = 'tnsgud052812-boop';
const REPO_NAME = 'Pacer';
const BRANCH = 'main';

let config = { teams: [] };
let latestData = [];
let availableMonths = [];
let currentMonthIdx = 0; // index into availableMonths

document.addEventListener('DOMContentLoaded', init);

async function init() {
    await loadConfig();
    await loadLatestData();
    await loadAvailableMonths();
    currentMonthIdx = 0; // newest
    updateMonthUI();
    render();
}

/* ── Data Loading ── */

async function loadConfig() {
    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/config.json?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        if (data.groups) {
            config.teams = [];
            data.groups.forEach(g => (g.teams || []).forEach(t => config.teams.push(t)));
            config.admins = data.admins;
        } else if (data.teams) {
            config = data;
        }
    } catch(e) { console.error('config error', e); }
}

async function loadLatestData() {
    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/latest.csv?t=${Date.now()}`;
        const res = await fetch(url);
        const csv = await res.text();
        latestData = parseCSV(csv);
        if (latestData.length && latestData[0]['크롤링일시']) {
            document.getElementById('updateTime').textContent = '업데이트 ' + latestData[0]['크롤링일시'];
        }
    } catch(e) { console.error('latest error', e); }
}

async function loadAvailableMonths() {
    try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/daily`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        availableMonths = data
            .filter(d => d.type === 'dir')
            .map(d => d.name)
            .sort()
            .reverse();
    } catch(e) { console.error('months error', e); }
}

function parseCSV(csv) {
    const lines = csv.trim().split('\n');
    if (lines.length < 2) return [];
    const headers = lines[0].split(',');
    return lines.slice(1).map(line => {
        const vals = line.split(',');
        const row = {};
        headers.forEach((h, i) => row[h.trim()] = (vals[i] || '').trim());
        return row;
    });
}

/* ── Month Navigation ── */

function getSelectedMonth() {
    return availableMonths[currentMonthIdx] || '';
}

function parseMonthStr(s) {
    const m = s.match(/(\d+)년(\d+)월/);
    if (!m) return null;
    return { year: parseInt(m[1]), month: parseInt(m[2]) };
}

function getDaysElapsed() {
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    if (!parsed) return 1;
    const today = new Date();
    const isCurrentMonth = (parsed.year === today.getFullYear() && parsed.month === today.getMonth() + 1);
    if (isCurrentMonth) {
        return today.getDate();
    } else {
        // 해당 월의 마지막 날
        return new Date(parsed.year, parsed.month, 0).getDate();
    }
}

function updateMonthUI() {
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    const days = getDaysElapsed();
    const label = parsed ? `${parsed.year}. ${String(parsed.month).padStart(2,'0')}` : '–';
    document.getElementById('monthLabel').innerHTML = `${label}<span class="month-days">(${days}일)</span>`;
    document.getElementById('prevMonth').disabled = currentMonthIdx >= availableMonths.length - 1;
    document.getElementById('nextMonth').disabled = currentMonthIdx <= 0;
}

function changeMonth(dir) {
    const next = currentMonthIdx - dir; // -dir because array is newest-first
    if (next < 0 || next >= availableMonths.length) return;
    currentMonthIdx = next;
    updateMonthUI();

    // 월이 바뀌면 해당 월의 latest를 로드해야 하지만,
    // latest.csv는 현재 월만 반영. 과거 월은 daily CSV 합산 필요.
    // 우선 현재 월은 latest.csv 사용, 과거 월은 마지막 날 daily CSV 사용
    loadMonthData().then(render);
}

async function loadMonthData() {
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    if (!parsed) return;

    const today = new Date();
    const isCurrentMonth = (parsed.year === today.getFullYear() && parsed.month === today.getMonth() + 1);

    if (isCurrentMonth) {
        // latest.csv 재사용
        await loadLatestData();
    } else {
        // 해당 월 마지막 날 daily CSV에서 월누적 읽기
        const lastDay = new Date(parsed.year, parsed.month, 0).getDate();
        let loaded = false;

        // 마지막 날부터 역순으로 찾기
        for (let d = lastDay; d >= 1 && !loaded; d--) {
            const dateStr = `${parsed.year}-${String(parsed.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/daily/${ms}/${dateStr}.csv`;
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const csv = await res.text();
                    latestData = parseCSV(csv);
                    loaded = true;
                }
            } catch(e) {}
        }

        if (!loaded) latestData = [];
    }
}

/* ── Data Helpers ── */

function getRegisteredMembers() {
    const s = new Set();
    (config.teams || []).forEach(t => (t.members || []).forEach(m => s.add(m)));
    return s;
}

function getMember(name) {
    return latestData.find(d => d['이름'] === name) || {};
}

function getMonthlyTotal(name) {
    const d = getMember(name);
    return parseInt(d['월누적']) || parseInt(d['월간누적']) || 0;
}

function getDailyAvg(name) {
    const total = getMonthlyTotal(name);
    const days = getDaysElapsed();
    return days > 0 ? Math.floor(total / days) : 0;
}

function getTeamStats() {
    const days = getDaysElapsed();
    return (config.teams || []).map(team => {
        let totalSteps = 0;
        let count = 0;
        (team.members || []).forEach(name => {
            totalSteps += getMonthlyTotal(name);
            count++;
        });
        const avgDaily = count > 0 ? Math.floor(totalSteps / count / days) : 0;
        return { ...team, avgDaily, memberCount: count };
    }).sort((a, b) => b.avgDaily - a.avgDaily);
}

/* ── Rendering ── */

function render() {
    renderSummary();
    renderTeams();
    renderRanking();
}

function renderSummary() {
    const registered = getRegisteredMembers();
    const data = latestData.filter(d => registered.has(d['이름']));
    document.getElementById('sMembers').textContent = data.length;

    const days = getDaysElapsed();
    let totalSteps = 0;
    data.forEach(d => totalSteps += parseInt(d['월누적']) || parseInt(d['월간누적']) || 0);
    const avg = data.length > 0 ? Math.floor(totalSteps / data.length / days) : 0;
    document.getElementById('sAvg').textContent = fmt(avg);

    const teams = getTeamStats();
    if (teams.length) {
        document.getElementById('sTop').textContent = teams[0].name;
    }
}

function renderTeams() {
    const teams = getTeamStats();
    const container = document.getElementById('teamList');

    if (!teams.length) {
        container.innerHTML = '<div class="loading-box">팀이 설정되지 않았습니다.</div>';
        return;
    }

    const days = getDaysElapsed();

    container.innerHTML = teams.map((team, idx) => {
        const rank = idx + 1;
        const rc = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'rd';

        const members = (team.members || []).map(name => {
            const total = getMonthlyTotal(name);
            const avg = days > 0 ? Math.floor(total / days) : 0;
            return { name, avg, total };
        }).sort((a, b) => b.avg - a.avg);

        return `
        <div class="team-card" id="tc-${team.id}">
            <div class="tc-header" onclick="toggleTC('${team.id}')">
                <div class="tc-rank ${rc}">${rank}</div>
                <div class="tc-info">
                    <div class="tc-name">${team.name}</div>
                    <div class="tc-meta">${team.memberCount}명</div>
                </div>
                <div class="tc-avg">
                    <div class="tc-avg-num">${fmt(team.avgDaily)}</div>
                    <div class="tc-avg-unit">보 / 일</div>
                </div>
                <div class="tc-chevron">▼</div>
            </div>
            <div class="tc-body">
                ${members.map((m, i) => `
                <div class="mr" onclick="event.stopPropagation(); showDetail('${m.name}')">
                    <span class="mr-idx">${i+1}</span>
                    <span class="mr-name">${m.name}</span>
                    <span class="mr-avg">${fmt(m.avg)}</span>
                    <span class="mr-total">누적 ${fmt(m.total)}</span>
                </div>`).join('')}
            </div>
        </div>`;
    }).join('');
}

function toggleTC(id) {
    document.getElementById('tc-' + id).classList.toggle('open');
}

function renderRanking(filter = '') {
    const registered = getRegisteredMembers();
    const days = getDaysElapsed();
    const teamMap = {};
    (config.teams || []).forEach(t => (t.members || []).forEach(m => teamMap[m] = t.name));

    let rows = [];
    for (const name of registered) {
        const total = getMonthlyTotal(name);
        const avg = days > 0 ? Math.floor(total / days) : 0;
        rows.push({ name, avg, total, team: teamMap[name] || '-' });
    }
    rows.sort((a, b) => b.avg - a.avg);

    if (filter) {
        rows = rows.filter(r => r.name.includes(filter));
    }

    const maxAvg = rows.length ? rows[0].avg : 1;
    const tbody = document.getElementById('rankBody');

    tbody.innerHTML = rows.map((r, i) => {
        const rank = i + 1;
        const rc = rank === 1 ? 'rn1' : rank === 2 ? 'rn2' : rank === 3 ? 'rn3' : 'rnd';
        const pct = ((r.avg / maxAvg) * 100).toFixed(1);
        return `
        <tr onclick="showDetail('${r.name}')">
            <td><span class="rank-num ${rc}">${rank}</span></td>
            <td><strong>${r.name}</strong></td>
            <td style="color:var(--text-dim);font-size:0.78rem;">${r.team}</td>
            <td class="bar-cell">
                <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
            </td>
            <td style="font-weight:700;">${fmt(r.avg)}</td>
        </tr>`;
    }).join('');
}

function filterRanking() {
    renderRanking(document.getElementById('searchInput').value);
}

/* ── Tabs ── */

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('teamsPanel').style.display = tab === 'teams' ? 'block' : 'none';
    document.getElementById('allPanel').style.display = tab === 'all' ? 'block' : 'none';
}

/* ── Detail Modal ── */

async function showDetail(name) {
    const overlay = document.getElementById('overlay');
    const bd = document.getElementById('modalBd');
    document.getElementById('modalName').textContent = name;
    bd.innerHTML = '<div class="loading-box"><div class="spin"></div></div>';
    overlay.classList.add('show');

    const days = getDaysElapsed();
    const total = getMonthlyTotal(name);
    const avg = days > 0 ? Math.floor(total / days) : 0;

    // Load member history
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    const monthStr2 = parsed ? `${parsed.year}년${parsed.month}월` : '';
    const fileName = encodeURIComponent(`${name}_${monthStr2}_Data.csv`);
    const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/members/${fileName}?t=${Date.now()}`;

    let history = [];
    try {
        const res = await fetch(url);
        if (res.ok) history = parseCSV(await res.text());
    } catch(e) {}

    const dailySteps = history.map(h => parseInt(h['오늘걸음수']) || 0).filter(v => v > 0);
    const maxSteps = dailySteps.length ? Math.max(...dailySteps) : 0;
    const minSteps = dailySteps.length ? Math.min(...dailySteps) : 0;
    const maxDay = history.find(h => parseInt(h['오늘걸음수']) === maxSteps)?.['날짜'] || '-';
    const minDay = history.find(h => parseInt(h['오늘걸음수']) === minSteps)?.['날짜'] || '-';

    bd.innerHTML = `
        <div class="stat-grid">
            <div class="stat-card">
                <div class="sv" style="color:var(--accent)">${fmt(avg)}</div>
                <div class="sl">하루 평균</div>
            </div>
            <div class="stat-card">
                <div class="sv">${fmt(total)}</div>
                <div class="sl">월 누적</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--green)">${fmt(maxSteps)}</div>
                <div class="sl">최대</div>
                <div class="ss">${maxDay}</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--red)">${fmt(minSteps)}</div>
                <div class="sl">최소</div>
                <div class="ss">${minDay}</div>
            </div>
        </div>

        <div class="cal-title">📅 ${parsed ? parsed.year : ''}년 ${parsed ? parsed.month : ''}월</div>
        <div class="cal-grid" id="calGrid"></div>
    `;

    // Render calendar
    if (parsed) renderCalendar(parsed.year, parsed.month - 1, history);
}

function renderCalendar(year, month, history) {
    const grid = document.getElementById('calGrid');
    const today = new Date();
    const hmap = {};
    history.forEach(h => hmap[h['날짜']] = parseInt(h['오늘걸음수']) || 0);

    const dayNames = ['일','월','화','수','목','금','토'];
    let html = dayNames.map(d => `<div class="cal-hd">${d}</div>`).join('');

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

    for (let d = 1; d <= lastDate; d++) {
        const ds = `${String(month+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
        const steps = hmap[ds];
        const isToday = (year === today.getFullYear() && month === today.getMonth() && d === today.getDate());
        const has = steps !== undefined;
        html += `<div class="cal-day ${isToday ? 'today' : ''} ${has ? 'has' : ''}">
            <span class="dn">${d}</span>
            ${has ? `<span class="ds">${(steps/1000).toFixed(0)}k</span>` : ''}
        </div>`;
    }

    grid.innerHTML = html;
}

function closeModal() {
    document.getElementById('overlay').classList.remove('show');
}

/* ── Utils ── */

function fmt(n) {
    return (n || 0).toLocaleString('ko-KR');
}
