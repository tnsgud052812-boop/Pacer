<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캔탑스 만보걷기</title>
    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem('pacerTheme');
                const preferredTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.dataset.theme = ['dark', 'light'].includes(savedTheme)
                    ? savedTheme
                    : preferredTheme;
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0c0f14;
            --surface: #161a22;
            --surface2: #1e2330;
            --border: #2a2f3d;
            --text: #e8eaf0;
            --text-dim: #7a8195;
            --text-muted: #4a5068;
            --accent: #5b8def;
            --accent-glow: rgba(91, 141, 239, 0.15);
            --gold: #f0c850;
            --gold-dim: rgba(240, 200, 80, 0.12);
            --silver: #a0aec0;
            --bronze: #d4845e;
            --green: #4ade80;
            --red: #f87171;
            --radius: 12px;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface2: #edf1f7;
            --border: #d8dee9;
            --text: #1f2937;
            --text-dim: #647184;
            --text-muted: #8a96a8;
            --accent: #4169d8;
            --accent-glow: rgba(65, 105, 216, 0.12);
            --gold: #a87500;
            --gold-dim: rgba(168, 117, 0, 0.1);
            --silver: #667085;
            --bronze: #a75f3b;
            --green: #198754;
            --red: #d14343;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            padding: 28px 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            max-width: 960px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-meta {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }

        .theme-toggle,
        .admin-link {
            display: inline-block;
            padding: 5px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            font-family: inherit;
            line-height: 1.4;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover,
        .admin-link:hover {
            background: var(--surface);
            color: var(--text);
            border-color: var(--accent);
        }

        /* ── Container ── */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ── Month Selector ── */
        .month-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            padding: 0 12px;
        }

        .month-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .month-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .month-label {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            min-width: 140px;
            text-align: center;
        }

        .month-days {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-left: 4px;
            font-weight: 400;
        }

        .season-range {
            display: block;
            margin-top: 3px;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0;
        }

        .season-selector {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
        }

        .season-selector.show {
            display: flex;
        }

        .season-selector label {
            flex: 0 0 auto;
            color: var(--text-dim);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .season-select {
            min-width: 220px;
            max-width: 100%;
            padding: 8px 34px 8px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            background: var(--surface);
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .view-switch {
            display: flex;
            width: fit-content;
            margin: 0 0 8px;
            padding: 3px;
            gap: 3px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
        }

        .view-switch button {
            padding: 7px 14px;
            border: 0;
            border-radius: 7px;
            color: var(--text-dim);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.78rem;
        }

        .view-switch button.active {
            color: #fff;
            background: var(--accent);
        }

        .view-switch button.unavailable:not(.active) {
            opacity: 0.55;
        }

        .control-label {
            margin: 0 0 7px;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .period-help {
            min-height: 18px;
            margin-bottom: 14px;
            color: var(--text-dim);
            font-size: 0.72rem;
        }

        .period-help.warning {
            color: var(--gold);
        }

        /* ── Notice ── */
        .notice {
            background: rgba(240, 200, 80, 0.06);
            border: 1px solid rgba(240, 200, 80, 0.15);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 24px;
            font-size: 0.8rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Summary Row ── */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .summary-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: center;
        }

        .summary-item .val {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .summary-item .lbl {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .val-accent { color: var(--accent); }
        .val-gold { color: var(--gold); }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 2px;
            margin-bottom: 20px;
            background: var(--surface);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        /* ── Team Card ── */
        .team-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .team-card:hover {
            border-color: var(--text-muted);
        }

        .tc-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            gap: 16px;
            user-select: none;
        }

        .tc-rank {
            font-size: 1.5rem;
            font-weight: 900;
            min-width: 36px;
            text-align: center;
        }

        .tc-rank.r1 { color: var(--gold); }
        .tc-rank.r2 { color: var(--silver); }
        .tc-rank.r3 { color: var(--bronze); }
        .tc-rank.rd { color: var(--text-muted); }

        .tc-info { flex: 1; }

        .tc-name {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.3px;
        }

        .tc-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .tc-avg {
            text-align: right;
        }

        .tc-avg-num {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .tc-avg-unit {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .tc-chevron {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: transform 0.25s;
        }

        .team-card.open .tc-chevron {
            transform: rotate(180deg);
        }

        .tc-body {
            display: none;
            border-top: 1px solid var(--border);
            padding: 12px 20px 16px;
        }

        .team-card.open .tc-body {
            display: block;
        }

        /* ── Member Row (inside team) ── */
        .mr {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 6px;
        }

        .mr:last-child { border-bottom: none; }
        .mr:hover { background: var(--surface2); }

        .mr-idx {
            width: 24px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .mr-name {
            flex: 1;
            font-size: 0.88rem;
            font-weight: 500;
        }

        .mr-avg {
            font-weight: 700;
            font-size: 0.92rem;
            min-width: 70px;
            text-align: right;
        }

        .mr-total {
            font-size: 0.72rem;
            color: var(--text-dim);
            min-width: 80px;
            text-align: right;
        }

        /* ── Individual Ranking ── */
        .rank-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rank-table th {
            text-align: left;
            padding: 10px 12px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        .rank-table th:last-child,
        .rank-table td:last-child {
            text-align: right;
        }

        .rank-table .numeric-cell {
            text-align: right;
            white-space: nowrap;
        }

        .rank-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }

        .rank-table tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .rank-table tbody tr:hover {
            background: var(--surface2);
        }

        .rank-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.82rem;
        }

        .rn1 { background: var(--gold-dim); color: var(--gold); }
        .rn2 { background: rgba(160,174,192,0.1); color: var(--silver); }
        .rn3 { background: rgba(212,132,94,0.1); color: var(--bronze); }
        .rnd { color: var(--text-muted); }

        .bar-cell { width: 140px; }

        .mini-bar {
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .mini-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.88rem;
            margin-bottom: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        /* ── Modal ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .overlay.show { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 2;
        }

        .modal-hd h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .modal-bd {
            padding: 24px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--surface2);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .stat-card .sv {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .stat-card .sl {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .stat-card .ss {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Calendar ── */
        .cal-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .cal-hd {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 6px 0;
            font-weight: 600;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.75rem;
            background: var(--surface2);
        }

        .cal-day.empty { background: transparent; }

        .cal-day.has {
            background: var(--accent-glow);
        }

        .cal-day.today {
            border: 1.5px solid var(--accent);
        }

        .cal-day .dn {
            font-weight: 600;
            color: var(--text-dim);
            font-size: 0.72rem;
        }

        .cal-day .ds {
            font-size: 0.55rem;
            color: var(--text-dim);
        }

        /* ── Loading ── */
        .loading-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .spin {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: sp 0.7s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes sp { to { transform: rotate(360deg); } }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .header { padding: 20px 16px 16px; }
            .container { padding: 0 12px 40px; }
            .summary-bar { grid-template-columns: 1fr; gap: 8px; }
            .summary-item { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
            .summary-item .val { font-size: 1.3rem; }
            .summary-item .lbl { margin-top: 0; }
            .bar-cell { display: none; }
            .month-label { font-size: 1.1rem; min-width: 120px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <div class="logo-icon">🚶</div>
        <span id="siteTitle">캔탑스 만보걷기</span>
    </div>
    <div class="header-meta">
        <div id="updateTime">로딩 중...</div>
        <div class="header-actions">
            <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="화면 테마 변경">☀ 라이트</button>
            <a href="admin.html" class="admin-link">⚙ 관리자</a>
        </div>
    </div>
</div>

<div class="container">
    <!-- Notice -->
    <div class="notice" id="dataNotice">
        ⚠️ Pacer 앱 동기화가 늦어지면 통계가 달라질 수 있습니다. 매일 앱을 실행해 주세요.
    </div>

    <div class="control-label">집계 기준</div>
    <div class="view-switch" id="viewSwitch">
        <button id="seasonViewBtn" onclick="switchViewMode('season')">시즌별</button>
        <button id="monthlyViewBtn" onclick="switchViewMode('monthly')">월별</button>
    </div>
    <div class="period-help" id="periodHelp"></div>

    <div class="season-selector" id="seasonSelector">
        <label for="seasonSelect">시즌 선택</label>
        <select class="season-select" id="seasonSelect" onchange="changeSeason(this.value)"></select>
    </div>

    <!-- Month Nav -->
    <div class="month-nav">
        <button class="month-btn" id="prevMonth" onclick="changeMonth(-1)">◀</button>
        <div class="month-label" id="monthLabel">–</div>
        <button class="month-btn" id="nextMonth" onclick="changeMonth(1)">▶</button>
    </div>

    <!-- Summary -->
    <div class="summary-bar">
        <div class="summary-item">
            <span class="lbl">참여 인원</span>
            <span class="val" id="sMembers">–</span>
        </div>
        <div class="summary-item">
            <span class="lbl" id="sAvgLabel">전체 하루 평균</span>
            <span class="val val-accent" id="sAvg">–</span>
        </div>
        <div class="summary-item">
            <span class="lbl" id="sTopLabel">1위 팀</span>
            <span class="val val-gold" id="sTop">–</span>
        </div>
    </div>

    <!-- Tabs -->
    <div class="control-label">순위 구분</div>
    <div class="tab-bar">
        <button class="tab-btn active" id="teamTabBtn" data-tab="teams" onclick="switchTab('teams')">팀 순위</button>
        <button class="tab-btn" id="allTabBtn" data-tab="all" onclick="switchTab('all')">개인 랭킹</button>
    </div>

    <!-- Teams Tab -->
    <div id="teamsPanel">
        <div id="teamList">
            <div class="loading-box"><div class="spin"></div>불러오는 중...</div>
        </div>
    </div>

    <!-- All Ranking Tab -->
    <div id="allPanel" style="display:none;">
        <input type="text" class="search-box" id="searchInput" placeholder="이름 검색..." oninput="filterRanking()">
        <div style="overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius);">
            <table class="rank-table">
                <thead>
                    <tr>
                        <th style="width:50px;">#</th>
                        <th>이름</th>
                        <th>소속</th>
                        <th class="bar-cell"></th>
                        <th class="numeric-cell" id="rankTotalLabel">누적 걸음수</th>
                        <th id="rankAvgLabel">하루 평균</th>
                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
        <div class="modal-hd">
            <h2 id="modalName">–</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-bd" id="modalBd">
            <div class="loading-box"><div class="spin"></div></div>
        </div>
    </div>
</div>

<script>
const REPO_OWNER = 'tnsgud052812-boop';
const REPO_NAME = 'Pacer';
const BRANCH = 'main';

let config = {
    teams: [],
    display: { title: '캔탑스 만보걷기' }
};
let latestData = [];
let availableMonths = [];
let currentMonthIdx = 0; // index into availableMonths
let latestDataMonth = '';
let monthlyDataAsOfDate = '';
let seasons = [];
let selectedSeasonId = '';
let seasonData = [];
let seasonStatus = null;
let viewMode = 'monthly';

document.addEventListener('DOMContentLoaded', init);

async function init() {
    await loadConfig();
    await loadLatestData();
    await Promise.all([loadAvailableMonths(), loadSeasonCatalog()]);
    currentMonthIdx = 0; // newest

    if (hasSeasonView()) {
        viewMode = 'season';
    } else if (getSelectedMonth() && getSelectedMonth() !== latestDataMonth) {
        await loadMonthData();
    }

    updatePeriodUI();
    render();
}

/* ── Data Loading ── */

async function loadConfig() {
    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/config.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        config = normalizeConfig(data);
        applyDisplaySettings();
    } catch(e) {
        config = normalizeConfig({ teams: [] });
        applyDisplaySettings();
        console.error('config error', e);
    }
}

async function loadLatestData() {
    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/latest.csv?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csv = await res.text();
        latestData = normalizeStepRows(parseCSV(csv));
        latestDataMonth = getDataMonth(latestData) || getCurrentKSTMonth();
        monthlyDataAsOfDate = getDataDate(latestData);
        if (latestData.length && latestData[0]['크롤링일시']) {
            document.getElementById('updateTime').textContent = '업데이트 ' + formatTimestamp(latestData[0]['크롤링일시']);
        }
    } catch(e) {
        latestData = [];
        latestDataMonth = '';
        monthlyDataAsOfDate = '';
        document.getElementById('updateTime').textContent = '데이터를 불러오지 못했습니다.';
        console.error('latest error', e);
    }
}

async function loadAvailableMonths() {
    const months = new Set();

    try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/daily?ref=${encodeURIComponent(BRANCH)}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (Array.isArray(data)) {
            data.forEach(item => {
                if (item.type === 'dir' && parseMonthStr(item.name)) {
                    months.add(item.name);
                    return;
                }

                // 구버전 구조: data/daily/2026-09-15.csv
                const match = item.type === 'file'
                    ? item.name.match(/^(\d{4})-(\d{2})-\d{2}\.csv$/)
                    : null;
                if (match) months.add(`${Number(match[1])}년${Number(match[2])}월`);
            });
        }
    } catch(e) {
        // GitHub API 제한이 걸려도 latest.csv를 기준으로 페이지는 계속 동작한다.
        console.error('months error', e);
    }

    if (latestDataMonth) months.add(latestDataMonth);
    if (!months.size) months.add(getCurrentKSTMonth());

    availableMonths = [...months].sort((a, b) => monthSortValue(b) - monthSortValue(a));
}

async function loadSeasonCatalog() {
    seasons = [];
    selectedSeasonId = '';

    try {
        const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/seasons.json?t=${Date.now()}`;
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`catalog HTTP ${response.status}`);
        const data = await response.json();
        seasons = Array.isArray(data)
            ? data.filter(item => item?.id && item?.name && item?.startDate && item?.endDate)
            : [];
    } catch (error) {
        // seasons.json 도입 전 저장소도 기존 시즌 화면으로 계속 표시한다.
        console.warn('season catalog error', error);
    }

    if (!seasons.length) {
        await loadSeasonData('');
        return;
    }

    const requestedId = new URLSearchParams(location.search).get('season');
    const selected = seasons.find(item => item.id === requestedId)
        || seasons.find(item => item.current)
        || seasons[0];
    selectedSeasonId = selected.id;
    await loadSeasonData(selectedSeasonId);
    renderSeasonSelector();
}

async function loadSeasonData(seasonId = selectedSeasonId) {
    seasonData = [];
    seasonStatus = null;

    try {
        const catalogItem = seasons.find(item => item.id === seasonId);
        const basePath = catalogItem?.dataPath || (seasonId ? `data/seasons/${encodeURIComponent(seasonId)}` : 'data');
        const statusUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${basePath}/season_status.json?t=${Date.now()}`;
        const statusResponse = await fetch(statusUrl, { cache: 'no-store' });
        if (!statusResponse.ok) throw new Error(`status HTTP ${statusResponse.status}`);
        seasonStatus = await statusResponse.json();

        if (!['before', 'active', 'ended'].includes(seasonStatus?.status)) return;

        const csvUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${basePath}/season.csv?t=${Date.now()}`;
        const csvResponse = await fetch(csvUrl, { cache: 'no-store' });
        if (!csvResponse.ok) throw new Error(`CSV HTTP ${csvResponse.status}`);
        seasonData = normalizeSeasonRows(parseCSV(await csvResponse.text()));

        if (seasonStatus.generatedAt) {
            document.getElementById('updateTime').textContent = '시즌 집계 ' + formatTimestamp(seasonStatus.generatedAt);
        }
    } catch (error) {
        seasonData = [];
        seasonStatus = null;
        console.error('season data error', error);
    }
}

function renderSeasonSelector() {
    const selector = document.getElementById('seasonSelector');
    const select = document.getElementById('seasonSelect');
    if (!selector || !select) return;

    selector.classList.toggle('show', viewMode === 'season' && seasons.length > 0);
    select.innerHTML = seasons.map(item => {
        const statusLabel = item.current ? ' · 현재' : '';
        return `<option value="${escapeHTML(item.id)}" ${item.id === selectedSeasonId ? 'selected' : ''}>${escapeHTML(item.name)}${statusLabel}</option>`;
    }).join('');
}

async function changeSeason(seasonId) {
    if (!seasons.some(item => item.id === seasonId) || seasonId === selectedSeasonId) return;
    selectedSeasonId = seasonId;
    await loadSeasonData(selectedSeasonId);

    const url = new URL(location.href);
    url.searchParams.set('season', selectedSeasonId);
    history.replaceState(null, '', url);

    renderSeasonSelector();
    updatePeriodUI();
    render();
}

function parseCSV(csv) {
    if (typeof csv !== 'string' || !csv.trim()) return [];

    // RFC 4180 방식의 쉼표/따옴표/줄바꿈을 처리한다.
    const text = csv.replace(/^\uFEFF/, '');
    const records = [];
    let record = [];
    let field = '';
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (char === '"') {
            if (quoted && text[i + 1] === '"') {
                field += '"';
                i++;
            } else {
                quoted = !quoted;
            }
        } else if (char === ',' && !quoted) {
            record.push(field);
            field = '';
        } else if ((char === '\n' || char === '\r') && !quoted) {
            if (char === '\r' && text[i + 1] === '\n') i++;
            record.push(field);
            if (record.some(value => String(value).trim() !== '')) records.push(record);
            record = [];
            field = '';
        } else {
            field += char;
        }
    }

    record.push(field);
    if (record.some(value => String(value).trim() !== '')) records.push(record);
    if (records.length < 2) return [];

    const headers = records.shift().map(header => String(header).replace(/^\uFEFF/, '').trim());
    return records.map(values => {
        const row = {};
        headers.forEach((header, index) => {
            if (header) row[header] = String(values[index] ?? '').trim();
        });
        return row;
    });
}

function normalizeConfig(data) {
    const displaySource = data?.display && typeof data.display === 'object' ? data.display : {};
    const display = {
        ...displaySource,
        title: String(displaySource.title ?? '캔탑스 만보걷기').trim() || '캔탑스 만보걷기'
    };

    const sourceTeams = Array.isArray(data?.groups)
        ? data.groups.flatMap(group => Array.isArray(group?.teams) ? group.teams : [])
        : Array.isArray(data?.teams) ? data.teams : [];

    const teams = sourceTeams.map((team, index) => {
        const members = Array.isArray(team?.members)
            ? team.members.map(normalizeMemberName).filter(Boolean)
            : [];
        return {
            ...team,
            id: String(team?.id ?? `team-${index + 1}`),
            name: String(team?.name ?? team?.['팀명'] ?? `팀 ${index + 1}`).trim(),
            members: [...new Set(members)]
        };
    });

    const seasonSource = data?.season && typeof data.season === 'object' ? data.season : {};
    const season = {
        ...seasonSource,
        name: String(seasonSource.name ?? '').trim(),
        startDate: String(seasonSource.startDate ?? '').trim(),
        endDate: String(seasonSource.endDate ?? '').trim()
    };

    return { ...(data || {}), teams, season, display };
}

function applyDisplaySettings() {
    const title = config.display?.title || '캔탑스 만보걷기';
    document.title = title;
    document.getElementById('siteTitle').textContent = title;
    updateThemeToggle();
}

function updateThemeToggle() {
    const button = document.getElementById('themeToggle');
    if (!button) return;
    const isLight = document.documentElement.dataset.theme === 'light';
    button.textContent = isLight ? '🌙 다크' : '☀ 라이트';
    button.title = isLight ? '다크 모드로 변경' : '라이트 모드로 변경';
}

function toggleTheme() {
    const nextTheme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = nextTheme;
    try {
        localStorage.setItem('pacerTheme', nextTheme);
    } catch (error) {
        console.warn('테마 설정을 저장하지 못했습니다.', error);
    }
    updateThemeToggle();
}

function normalizeMemberName(member) {
    if (typeof member === 'string') return member.trim();
    if (!member || typeof member !== 'object') return '';
    return String(member.name ?? member['이름'] ?? member.displayName ?? '').trim();
}

function getField(row, aliases) {
    for (const key of aliases) {
        const value = row?.[key];
        if (value !== undefined && value !== null && String(value).trim() !== '') {
            return String(value).trim();
        }
    }
    return '';
}

function normalizeStepRows(rows) {
    return rows.map(row => {
        const monthlyTotal = getField(row, ['월누적', '월간누적', '월 누적', '월간 누적']);
        return {
            ...row,
            '순위': getField(row, ['순위', 'rank', 'Rank']),
            '이름': getField(row, ['이름', '성명', '닉네임', 'name', 'Name']),
            '오늘걸음수': getField(row, ['오늘걸음수', '오늘 걸음수', '일일걸음수', '일일 걸음수']),
            '월누적': monthlyTotal,
            '월간누적': monthlyTotal,
            '크롤링일시': getField(row, ['크롤링일시', '크롤링 일시', '수집일시', '업데이트일시'])
        };
    }).filter(row => row['이름']);
}

function normalizeSeasonRows(rows) {
    return rows.map(row => ({
        ...row,
        '순위': getField(row, ['순위', 'rank', 'Rank']),
        '이름': getField(row, ['이름', '성명', '닉네임', 'name', 'Name']),
        '시즌누적': getField(row, ['시즌누적', '시즌 누적', '누적걸음수']),
        '하루평균': getField(row, ['하루평균', '하루 평균', '일평균']),
        '집계일수': getField(row, ['집계일수', '집계 일수']),
        '시즌명': getField(row, ['시즌명', '시즌 이름']),
        '시작일': getField(row, ['시작일', '시즌시작일']),
        '종료일': getField(row, ['종료일', '시즌종료일']),
        '집계기준일': getField(row, ['집계기준일', '기준일']),
        '생성일시': getField(row, ['생성일시', '업데이트일시'])
    })).filter(row => row['이름']);
}

function toOptionalNumber(value) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : null;
    if (value === undefined || value === null) return null;

    const text = String(value).trim();
    if (!text || /^(n\/?a|null|undefined|-)$/i.test(text)) return null;

    const normalized = text.replace(/,/g, '').replace(/[^0-9.+-]/g, '');
    if (!normalized) return null;
    const number = Number(normalized);
    return Number.isFinite(number) ? number : null;
}

function toNumber(value) {
    return toOptionalNumber(value) ?? 0;
}

function getDataMonth(rows) {
    const timestamp = rows?.[0]?.['크롤링일시'] || '';
    const match = timestamp.match(/(\d{4})[-/.](\d{1,2})/);
    return match ? `${Number(match[1])}년${Number(match[2])}월` : '';
}

function getDataDate(rows) {
    const timestamp = rows?.[0]?.['크롤링일시'] || '';
    const match = timestamp.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (!match) return '';
    return `${match[1]}-${String(Number(match[2])).padStart(2, '0')}-${String(Number(match[3])).padStart(2, '0')}`;
}

function getKSTParts() {
    const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
    }).formatToParts(new Date());
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return { year: Number(values.year), month: Number(values.month), day: Number(values.day) };
}

function getCurrentKSTMonth() {
    const now = getKSTParts();
    return `${now.year}년${now.month}월`;
}

function monthSortValue(monthString) {
    const parsed = parseMonthStr(monthString);
    return parsed ? parsed.year * 12 + parsed.month : 0;
}

function hasSeasonView() {
    return Boolean(
        seasonStatus &&
        ['before', 'active', 'ended'].includes(seasonStatus.status) &&
        seasonStatus.seasonName &&
        seasonStatus.startDate &&
        seasonStatus.endDate
    );
}

function getActiveData() {
    return viewMode === 'season' && hasSeasonView() ? seasonData : latestData;
}

function getActiveTeams() {
    if (viewMode === 'season' && hasSeasonView() && Array.isArray(seasonStatus.teams)) {
        return seasonStatus.teams;
    }
    return config.teams || [];
}

function formatTimestamp(value) {
    const text = String(value || '')
        .replace('T', ' ')
        .replace(/(Z|[+-]\d{2}:\d{2})$/, '');
    const match = text.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
    return match ? match[1] : text.replace(/\.\d+$/, '');
}

/* ── Month Navigation ── */

function getSelectedMonth() {
    return availableMonths[currentMonthIdx] || '';
}

function parseMonthStr(s) {
    const m = s.match(/(\d+)년(\d+)월/);
    if (!m) return null;
    return { year: parseInt(m[1]), month: parseInt(m[2]) };
}

function getDaysElapsed() {
    if (viewMode === 'season' && hasSeasonView()) {
        return Math.max(0, toNumber(seasonStatus.expectedDays));
    }

    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    if (!parsed) return 1;

    const asOfDate = parseISODateParts(monthlyDataAsOfDate);
    if (asOfDate && asOfDate.year === parsed.year && asOfDate.month === parsed.month) {
        return asOfDate.day;
    }

    const today = getKSTParts();
    const isCurrentMonth = (parsed.year === today.year && parsed.month === today.month);
    if (isCurrentMonth) {
        return today.day;
    } else {
        // 해당 월의 마지막 날
        return new Date(parsed.year, parsed.month, 0).getDate();
    }
}

function updateMonthUI() {
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    const days = getDaysElapsed();
    const label = parsed ? `${parsed.year}. ${String(parsed.month).padStart(2,'0')}` : '–';
    document.getElementById('monthLabel').innerHTML = `${label}<span class="month-days">(${days}일)</span>`;
    document.getElementById('prevMonth').disabled = currentMonthIdx >= availableMonths.length - 1;
    document.getElementById('nextMonth').disabled = currentMonthIdx <= 0;
}

function updatePeriodUI() {
    const prevButton = document.getElementById('prevMonth');
    const nextButton = document.getElementById('nextMonth');
    const label = document.getElementById('monthLabel');
    const seasonButton = document.getElementById('seasonViewBtn');
    const monthlyButton = document.getElementById('monthlyViewBtn');
    const periodHelp = document.getElementById('periodHelp');
    const seasonAvailable = hasSeasonView();

    seasonButton.classList.toggle('active', viewMode === 'season');
    monthlyButton.classList.toggle('active', viewMode === 'monthly');
    seasonButton.classList.toggle('unavailable', !seasonAvailable);
    seasonButton.title = seasonAvailable ? '설정된 시즌 전체 순위를 조회합니다.' : getSeasonUnavailableMessage();
    periodHelp.classList.toggle('warning', !seasonAvailable);
    periodHelp.textContent = seasonAvailable
        ? '시즌 전체 또는 월별 기록을 선택해 조회할 수 있습니다.'
        : getSeasonUnavailableMessage();
    renderSeasonSelector();

    if (viewMode === 'season' && hasSeasonView()) {
        prevButton.style.display = 'none';
        nextButton.style.display = 'none';
        const statusText = seasonStatus.status === 'before'
            ? '시작 전'
            : seasonStatus.status === 'active' ? '진행 중' : '종료';
        label.innerHTML = `${escapeHTML(seasonStatus.seasonName)}<span class="season-range">${escapeHTML(seasonStatus.startDate)} ~ ${escapeHTML(seasonStatus.endDate)} · ${statusText}</span>`;
        document.getElementById('sAvgLabel').textContent = '시즌 하루 평균';
        document.getElementById('sTopLabel').textContent = '시즌 1위 팀';
        document.getElementById('teamTabBtn').textContent = '시즌 팀 순위';
        document.getElementById('allTabBtn').textContent = '시즌 개인 랭킹';
        document.getElementById('rankTotalLabel').textContent = '시즌 누적';
        document.getElementById('rankAvgLabel').textContent = '시즌 하루 평균';
        updateSeasonNotice();
    } else {
        prevButton.style.display = 'flex';
        nextButton.style.display = 'flex';
        updateMonthUI();
        document.getElementById('sAvgLabel').textContent = '전체 하루 평균';
        document.getElementById('sTopLabel').textContent = '월간 1위 팀';
        document.getElementById('teamTabBtn').textContent = '월간 팀 순위';
        document.getElementById('allTabBtn').textContent = '월간 개인 랭킹';
        document.getElementById('rankTotalLabel').textContent = '월 누적';
        document.getElementById('rankAvgLabel').textContent = '하루 평균';
        document.getElementById('dataNotice').textContent = '⚠️ Pacer 앱 동기화가 늦어지면 통계가 달라질 수 있습니다. 매일 앱을 실행해 주세요.';
    }
}

function getSeasonUnavailableMessage() {
    if (seasonStatus?.status === 'invalid') {
        return `시즌 설정 오류: ${seasonStatus.message || '관리자 설정을 확인하세요.'}`;
    }
    if (seasonStatus?.status === 'not_configured') {
        return '시즌별 집계를 사용하려면 관리자 페이지에서 시즌 기간을 설정하세요.';
    }

    const season = config?.season || {};
    if (season.name && season.startDate && season.endDate) {
        return '시즌 설정은 저장됐지만 집계 데이터가 아직 없습니다. crawler를 한 번 실행하세요.';
    }
    return '시즌별 집계를 사용하려면 관리자 페이지에서 시즌 기간을 설정하세요.';
}

function updateSeasonNotice() {
    const notice = document.getElementById('dataNotice');
    notice.textContent = `📅 시즌 집계 기간: ${seasonStatus.startDate} ~ ${seasonStatus.endDate}`;
}

async function switchViewMode(mode) {
    if (mode === 'season' && !hasSeasonView()) {
        const message = getSeasonUnavailableMessage();
        const periodHelp = document.getElementById('periodHelp');
        periodHelp.textContent = message;
        periodHelp.classList.add('warning');
        document.getElementById('dataNotice').textContent = `⚠️ ${message}`;
        return;
    }
    if (mode === viewMode) return;

    viewMode = mode;
    if (viewMode === 'monthly') await loadMonthData();
    updatePeriodUI();
    render();
}

function changeMonth(dir) {
    if (viewMode !== 'monthly') return;
    const next = currentMonthIdx - dir; // -dir because array is newest-first
    if (next < 0 || next >= availableMonths.length) return;
    currentMonthIdx = next;
    updatePeriodUI();

    // 월이 바뀌면 해당 월의 latest를 로드해야 하지만,
    // latest.csv는 현재 월만 반영. 과거 월은 daily CSV 합산 필요.
    // 우선 현재 월은 latest.csv 사용, 과거 월은 마지막 날 daily CSV 사용
    loadMonthData().then(render);
}

async function loadMonthData() {
    const ms = getSelectedMonth();
    const parsed = parseMonthStr(ms);
    if (!parsed) return;

    if (ms === latestDataMonth || (!latestDataMonth && ms === getCurrentKSTMonth())) {
        // latest.csv가 실제로 담고 있는 월의 데이터
        await loadLatestData();
    } else {
        // 해당 월의 가장 최근 daily CSV에서 월누적 읽기
        const lastDay = new Date(parsed.year, parsed.month, 0).getDate();
        let loaded = false;

        // 마지막 날부터 역순으로 찾기
        for (let d = lastDay; d >= 1 && !loaded; d--) {
            const dateStr = `${parsed.year}-${String(parsed.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const paths = [
                `data/daily/${encodeURIComponent(ms)}/${dateStr}.csv`,
                `data/daily/${dateStr}.csv` // 구버전 폴더 구조 호환
            ];

            for (const path of paths) {
                const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${path}?t=${Date.now()}`;
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (res.ok) {
                        latestData = normalizeStepRows(parseCSV(await res.text()));
                        if (latestData.length) {
                            loaded = true;
                            monthlyDataAsOfDate = dateStr;
                            const timestamp = latestData[0]['크롤링일시'];
                            document.getElementById('updateTime').textContent = timestamp
                                ? '업데이트 ' + formatTimestamp(timestamp)
                                : '기준일 ' + dateStr;
                            break;
                        }
                    }
                } catch(e) {
                    console.error(`daily data error: ${path}`, e);
                }
            }
        }

        if (!loaded) {
            latestData = [];
            monthlyDataAsOfDate = '';
            document.getElementById('updateTime').textContent = '해당 월의 데이터가 없습니다.';
        }
    }
}

/* ── Data Helpers ── */

function getRegisteredMembers() {
    const s = new Set();
    getActiveTeams().forEach(t => (t.members || []).forEach(m => s.add(m)));
    return s;
}

function getMember(name) {
    return getActiveData().find(d => d['이름'] === name) || {};
}

function getAccumulatedTotal(name) {
    const d = getMember(name);
    if (viewMode === 'season' && hasSeasonView()) return toNumber(d['시즌누적']);
    return toNumber(d['월누적'] ?? d['월간누적']);
}

function getDailyAvg(name) {
    const total = getAccumulatedTotal(name);
    const days = getDaysElapsed();
    return days > 0 ? Math.floor(total / days) : 0;
}

function getTeamStats() {
    const days = getDaysElapsed();
    return getActiveTeams().map(team => {
        let totalSteps = 0;
        let count = 0;
        (team.members || []).forEach(name => {
            totalSteps += getAccumulatedTotal(name);
            count++;
        });
        const avgDaily = count > 0 && days > 0 ? Math.floor(totalSteps / count / days) : 0;
        return { ...team, totalSteps, avgDaily, memberCount: count };
    }).sort((a, b) => b.avgDaily - a.avgDaily || b.totalSteps - a.totalSteps);
}

/* ── Rendering ── */

function render() {
    renderSummary();
    renderTeams();
    renderRanking();
}

function renderSummary() {
    const registered = getRegisteredMembers();
    const data = getActiveData().filter(d => registered.has(d['이름']));
    document.getElementById('sMembers').textContent = data.length;

    const days = getDaysElapsed();
    let totalSteps = 0;
    data.forEach(d => {
        totalSteps += viewMode === 'season'
            ? toNumber(d['시즌누적'])
            : toNumber(d['월누적'] ?? d['월간누적']);
    });
    const avg = data.length > 0 && days > 0 ? Math.floor(totalSteps / data.length / days) : 0;
    document.getElementById('sAvg').textContent = fmt(avg);

    const teams = getTeamStats();
    document.getElementById('sTop').textContent = teams.length ? teams[0].name : '-';
}

function renderTeams() {
    const teams = getTeamStats();
    const container = document.getElementById('teamList');

    if (!teams.length) {
        container.innerHTML = '<div class="loading-box">팀이 설정되지 않았습니다.</div>';
        return;
    }

    const days = getDaysElapsed();

    container.innerHTML = teams.map((team, idx) => {
        const rank = idx + 1;
        const rc = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'rd';

        const members = (team.members || []).map(name => {
            const total = getAccumulatedTotal(name);
            const avg = days > 0 ? Math.floor(total / days) : 0;
            return { name, avg, total };
        }).sort((a, b) => b.avg - a.avg);

        return `
        <div class="team-card" id="tc-${escapeHTML(team.id)}">
            <div class="tc-header" onclick="toggleTC(${actionArg(team.id)})">
                <div class="tc-rank ${rc}">${rank}</div>
                <div class="tc-info">
                    <div class="tc-name">${escapeHTML(team.name)}</div>
                    <div class="tc-meta">${team.memberCount}명 · ${viewMode === 'season' ? '시즌' : '월'} 누적 ${fmt(team.totalSteps)}보</div>
                </div>
                <div class="tc-avg">
                    <div class="tc-avg-num">${fmt(team.avgDaily)}</div>
                    <div class="tc-avg-unit">보 / 일</div>
                </div>
                <div class="tc-chevron">▼</div>
            </div>
            <div class="tc-body">
                ${members.map((m, i) => `
                <div class="mr" onclick="event.stopPropagation(); showDetail(${actionArg(m.name)})">
                    <span class="mr-idx">${i+1}</span>
                    <span class="mr-name">${escapeHTML(m.name)}</span>
                    <span class="mr-avg">${fmt(m.avg)}</span>
                    <span class="mr-total">누적 ${fmt(m.total)}</span>
                </div>`).join('')}
            </div>
        </div>`;
    }).join('');
}

function toggleTC(id) {
    document.getElementById('tc-' + id).classList.toggle('open');
}

function renderRanking(filter = '') {
    const registered = getRegisteredMembers();
    const days = getDaysElapsed();
    const teamMap = {};
    getActiveTeams().forEach(t => (t.members || []).forEach(m => teamMap[m] = t.name));

    let rows = [];
    for (const name of registered) {
        const total = getAccumulatedTotal(name);
        const avg = days > 0 ? Math.floor(total / days) : 0;
        rows.push({ name, avg, total, team: teamMap[name] || '-' });
    }
    rows.sort((a, b) => b.total - a.total || b.avg - a.avg || a.name.localeCompare(b.name, 'ko'));

    if (filter) {
        rows = rows.filter(r => r.name.includes(filter));
    }

    const maxAvg = rows.length ? Math.max(rows[0].avg, 1) : 1;
    const tbody = document.getElementById('rankBody');

    tbody.innerHTML = rows.map((r, i) => {
        const rank = i + 1;
        const rc = rank === 1 ? 'rn1' : rank === 2 ? 'rn2' : rank === 3 ? 'rn3' : 'rnd';
        const pct = ((r.avg / maxAvg) * 100).toFixed(1);
        return `
        <tr onclick="showDetail(${actionArg(r.name)})">
            <td><span class="rank-num ${rc}">${rank}</span></td>
            <td><strong>${escapeHTML(r.name)}</strong></td>
            <td style="color:var(--text-dim);font-size:0.78rem;">${escapeHTML(r.team)}</td>
            <td class="bar-cell">
                <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
            </td>
            <td class="numeric-cell">${fmt(r.total)}</td>
            <td style="font-weight:700;">${fmt(r.avg)}</td>
        </tr>`;
    }).join('');
}

function filterRanking() {
    renderRanking(document.getElementById('searchInput').value);
}

/* ── Tabs ── */

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.getElementById('teamsPanel').style.display = tab === 'teams' ? 'block' : 'none';
    document.getElementById('allPanel').style.display = tab === 'all' ? 'block' : 'none';
}

/* ── Detail Modal ── */

function getSeasonMonths() {
    if (!hasSeasonView()) return [];

    const start = parseISODateParts(seasonStatus.startDate);
    const end = parseISODateParts(seasonStatus.asOfDate || seasonStatus.startDate);
    if (!start || !end) return [];

    const months = [];
    let year = start.year;
    let month = start.month;
    while (year < end.year || (year === end.year && month <= end.month)) {
        months.push({ year, month });
        month++;
        if (month > 12) {
            year++;
            month = 1;
        }
    }
    return months;
}

function parseISODateParts(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!match) return null;
    return { year: Number(match[1]), month: Number(match[2]), day: Number(match[3]) };
}

function historyDateToISO(value, year, month) {
    const normalized = normalizeHistoryDate(value);
    const match = normalized.match(/^(\d{2})\/(\d{2})$/);
    if (!match) return '';
    const rowMonth = Number(match[1]);
    const rowDay = Number(match[2]);
    if (rowMonth !== month || rowDay < 1 || rowDay > 31) return '';
    return `${year}-${String(month).padStart(2, '0')}-${String(rowDay).padStart(2, '0')}`;
}

async function loadMemberHistoryFile(name, year, month) {
    const monthString = `${year}년${month}월`;
    const fileName = encodeURIComponent(`${safeMemberFilename(name)}_${monthString}_Data.csv`);
    const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/data/members/${fileName}?t=${Date.now()}`;

    try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) return [];
        return normalizeHistoryRows(parseCSV(await response.text())).map(row => ({
            ...row,
            _year: year,
            _month: month,
            _isoDate: historyDateToISO(row['날짜'], year, month)
        }));
    } catch (error) {
        console.error(`member history error: ${monthString}`, error);
        return [];
    }
}

async function showDetail(name) {
    const overlay = document.getElementById('overlay');
    const bd = document.getElementById('modalBd');
    document.getElementById('modalName').textContent = name;
    bd.innerHTML = '<div class="loading-box"><div class="spin"></div></div>';
    overlay.classList.add('show');

    const days = getDaysElapsed();
    const total = getAccumulatedTotal(name);
    const avg = days > 0 ? Math.floor(total / days) : 0;

    const monthlyPeriod = parseMonthStr(getSelectedMonth());
    const periods = viewMode === 'season'
        ? getSeasonMonths()
        : (monthlyPeriod ? [monthlyPeriod] : []);

    let history = (await Promise.all(
        periods.map(period => loadMemberHistoryFile(name, period.year, period.month))
    )).flat();

    if (viewMode === 'season' && hasSeasonView()) {
        const effectiveEnd = seasonStatus.asOfDate || seasonStatus.startDate;
        history = history.filter(row =>
            row._isoDate &&
            row._isoDate >= seasonStatus.startDate &&
            row._isoDate <= effectiveEnd
        );
    }

    const dailySteps = history.map(h => toOptionalNumber(h['오늘걸음수'])).filter(v => v !== null && v > 0);
    const maxSteps = dailySteps.length ? Math.max(...dailySteps) : 0;
    const minSteps = dailySteps.length ? Math.min(...dailySteps) : 0;
    const maxRow = history.find(h => toOptionalNumber(h['오늘걸음수']) === maxSteps);
    const minRow = history.find(h => toOptionalNumber(h['오늘걸음수']) === minSteps);
    const displayHistoryDate = row => row
        ? (viewMode === 'season' ? row._isoDate.slice(5).replace('-', '/') : row['날짜'])
        : '-';
    const totalLabel = viewMode === 'season' ? '시즌 누적' : '월 누적';
    const calendarHTML = periods.length
        ? periods.map((period, index) => `
            <div class="cal-title">📅 ${period.year}년 ${period.month}월</div>
            <div class="cal-grid" id="calGrid-${index}"></div>
        `).join('')
        : '<div class="loading-box">표시할 기간이 없습니다.</div>';

    bd.innerHTML = `
        <div class="stat-grid">
            <div class="stat-card">
                <div class="sv" style="color:var(--accent)">${fmt(avg)}</div>
                <div class="sl">하루 평균</div>
            </div>
            <div class="stat-card">
                <div class="sv">${fmt(total)}</div>
                <div class="sl">${totalLabel}</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--green)">${fmt(maxSteps)}</div>
                <div class="sl">최대</div>
                <div class="ss">${displayHistoryDate(maxRow)}</div>
            </div>
            <div class="stat-card">
                <div class="sv" style="color:var(--red)">${fmt(minSteps)}</div>
                <div class="sl">최소</div>
                <div class="ss">${displayHistoryDate(minRow)}</div>
            </div>
        </div>

        ${calendarHTML}
    `;

    periods.forEach((period, index) => {
        renderCalendar(period.year, period.month - 1, history, `calGrid-${index}`);
    });
}

function renderCalendar(year, month, history, gridId = 'calGrid') {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    const today = getKSTParts();
    const hmap = {};
    history.forEach(h => {
        const steps = toOptionalNumber(h['오늘걸음수']);
        const belongsToMonth = h._year === undefined || (h._year === year && h._month === month + 1);
        if (belongsToMonth && h['날짜'] && steps !== null) hmap[h['날짜']] = steps;
    });

    const dayNames = ['일','월','화','수','목','금','토'];
    let html = dayNames.map(d => `<div class="cal-hd">${d}</div>`).join('');

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

    for (let d = 1; d <= lastDate; d++) {
        const ds = `${String(month+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
        const steps = hmap[ds];
        const isToday = (year === today.year && month + 1 === today.month && d === today.day);
        const has = steps !== undefined;
        html += `<div class="cal-day ${isToday ? 'today' : ''} ${has ? 'has' : ''}">
            <span class="dn">${d}</span>
            ${has ? `<span class="ds">${(steps/1000).toFixed(0)}k</span>` : ''}
        </div>`;
    }

    grid.innerHTML = html;
}

function closeModal() {
    document.getElementById('overlay').classList.remove('show');
}

/* ── Utils ── */

function fmt(n) {
    const value = toNumber(n);
    return value.toLocaleString('ko-KR');
}

function normalizeHistoryRows(rows) {
    return rows.map(row => ({
        ...row,
        '날짜': normalizeHistoryDate(getField(row, ['날짜', '일자', 'date', 'Date'])),
        '오늘걸음수': getField(row, ['오늘걸음수', '오늘 걸음수', '일일걸음수', '일일 걸음수']),
        '월누적': getField(row, ['월누적', '월간누적', '월 누적', '월간 누적'])
    })).filter(row => row['날짜']);
}

function normalizeHistoryDate(value) {
    const text = String(value || '').trim();
    let match = text.match(/^\d{4}[-/.](\d{1,2})[-/.](\d{1,2})$/);
    if (!match) match = text.match(/^(\d{1,2})[-/.](\d{1,2})$/);
    if (!match) return text;
    return `${String(Number(match[1])).padStart(2, '0')}/${String(Number(match[2])).padStart(2, '0')}`;
}

function safeMemberFilename(name) {
    return String(name).replace(/[\\/:*?"<>|]/g, '_');
}

function escapeHTML(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function actionArg(value) {
    return escapeHTML(JSON.stringify(String(value ?? '')));
}
