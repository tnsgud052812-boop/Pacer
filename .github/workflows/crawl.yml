name: Pacer 일별 크롤링

on:
  # 매일 12:00 KST (= 03:00 UTC)
  schedule:
    - cron: '5 6 * * *'

  # 수동 실행
  workflow_dispatch:

# 크롤링 결과를 저장소에 커밋할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

# 예약 실행과 수동 실행이 겹치는 것을 방지
concurrency:
  group: pacer-daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: python -m pip install requests

      - name: 크롤링 실행
        run: python crawler.py

      - name: 결과 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/

          if git diff --staged --quiet; then
            echo "변경된 데이터가 없습니다."
            exit 0
          fi

          git commit -m "$(date +'%Y-%m-%d') Pacer 데이터 업데이트"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
